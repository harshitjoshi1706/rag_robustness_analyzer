name: rag-evaluation
x-platform: &platform
  image: rag-evaluation:local
  build: .
  init: true
  restart: unless-stopped
  environment: &environment
    RAG_STORAGE: /storage
    RAG_RESEARCH_ROOT: /research
    RAG_MODEL_PATH: /models
    CELERY_BROKER_URL: redis://redis:6379/0
    RAG_ALLOW_FIXTURE: ${RAG_ALLOW_FIXTURE:-0}
    RAG_LEASE_SECONDS: ${RAG_LEASE_SECONDS:-90}
    RAG_TASK_TIMEOUT: ${RAG_TASK_TIMEOUT:-21600}
  volumes:
    - platform-data:/storage
    - ${RAG_RESEARCH_MOUNT:-../rag_chunk_robustness}:/research:ro
    - ${RAG_MODEL_MOUNT:-./var/model}:/models:ro
  depends_on:
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    mem_limit: 192m
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    <<: *platform
    command: [uvicorn, 'platform_eval.api:app', --host, 0.0.0.0, --port, '8000', --workers, '1']
    ports: ['127.0.0.1:8000:8000']
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *platform
    command: [celery, -A, 'platform_eval.celery_app:app', worker, --loglevel=INFO, --concurrency=1, --prefetch-multiplier=1, '--hostname=worker@%h']
    mem_limit: ${RAG_WORKER_MEMORY:-2g}
    cpus: 1
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -m, platform_eval.worker_health]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
  streamlit:
    <<: *platform
    command: [streamlit, run, app.py, --server.address=0.0.0.0, --server.port=8501, --server.headless=true]
    environment:
      <<: *environment
      RAG_API_URL: http://api:8000
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HOME: /storage/huggingface
    ports: ['127.0.0.1:8501:8501']
    mem_limit: 1g
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  prometheus:
    image: prom/prometheus:v3.2.1
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    restart: unless-stopped
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 256m
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://localhost:9090/-/ready']
      interval: 15s
      timeout: 5s
      retries: 5
  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    ports: ['127.0.0.1:3000:3000']
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  platform-data:
  redis-data:
  prometheus-data:
  grafana-data:
